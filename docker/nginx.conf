# Mobles CNC: SPA + PWA. Totes les dades són al navegador (IndexedDB); el servidor
# només serveix fitxers estàtics.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # Comprovació de salut del contenidor.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El service worker i l'índex no s'han de quedar a la memòria cau: si no, la PWA no
    # s'actualitza en publicar una versió nova.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        # nginx no coneix l'extensió (un bloc «types» aquí esborraria tots els altres tipus).
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Recursos amb hash al nom: es poden guardar per sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualsevol altra ruta torna l'app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
