# Publica l'app a GitHub Pages a cada push a main: a https://celtico.github.io/cnc/ o, si el
# repositori té un domini propi (Settings › Pages › Custom domain), a l'arrel d'aquell domini.
# Cal activar-ho un cop: Settings › Pages › Source: «GitHub Actions».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # la versió de l'app és el nombre de commits
      # On se serveix: «/cnc» a celtico.github.io, buit amb domini propi (que serveix des de l'arrel).
      - id: pages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
